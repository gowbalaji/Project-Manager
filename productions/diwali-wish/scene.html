<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diwali Wish</title>
<!--
  "The Big One": a 2D vector Diwali wish. 1080x1920, 23 seconds.
  Rendering is deterministic: window.setTime(t) draws the frame at t seconds.
  Open in a browser to preview (plays in real time); render.js captures frames.
  Change the sender line with ?name=Your%20Name in the URL; add &style=comic for the comic-book version.
-->
<style>
  @font-face { font-family: 'Bangers'; src: url('fonts/Bangers-Regular.ttf'); }
  @font-face { font-family: 'Baloo'; src: url('fonts/Baloo2-ExtraBold.ttf'); font-weight: 800; }
  html, body { margin: 0; height: 100%; background: #FDF6E3; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  .ol { stroke: #3B2416; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .comic .ol { stroke: #111; stroke-width: 6.5; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet">

      <stop offset="1" stop-color="#94401F"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.62" r="0.7">

      <stop offset="1" stop-color="#FFC56B" stop-opacity="0"/>

    <radialGradient id="edgeFade" gradientUnits="userSpaceOnUse" cx="540" cy="960" r="1100">

      <stop offset="1" stop-color="#fff"/>

    <mask id="edgeMask" maskUnits="userSpaceOnUse" x="-1000" y="-1000" width="3080" height="3920">
      <rect x="-1000" y="-1000" width="3080" height="3920" fill="url(#edgeFade)"/>
    </mask>
    <filter id="ink" x="-10%" y="-10%" width="125%" height="125%">
      <feFlood flood-color="#111" result="f"/>
      <feComposite in="f" in2="SourceAlpha" operator="in" result="sh"/>
      <feOffset dx="5" dy="5" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="cam">

  <rect id="halftone" x="-1000" y="-1000" width="3080" height="3920" fill="url(#dots)" mask="url(#edgeMask)" opacity="0"/>
  <rect id="warmth" width="1080" height="1920" fill="url(#warm)" opacity="0"/>

  <!-- marigold toran across the top -->

  <!-- ground line -->

  <!-- little sister -->

    </g>
    <g id="sisUpper">
      <g id="sisArmL"><rect x="-50" y="-166" width="20" height="56" rx="10" fill="#C98A5A" class="ol"/><circle cx="-40" cy="-162" r="13" fill="#2E9E6E" class="ol"/><circle cx="-40" cy="-108" r="10" fill="#C98A5A" class="ol" stroke-width="3"/></g>
      <g id="sisArmR"><rect x="30" y="-166" width="20" height="56" rx="10" fill="#C98A5A" class="ol"/><circle cx="40" cy="-162" r="13" fill="#2E9E6E" class="ol"/><circle cx="40" cy="-108" r="10" fill="#C98A5A" class="ol" stroke-width="3"/></g>
      <path d="M-36,-170 Q0,-178 36,-170 L36,-120 L-36,-120 Z" fill="#2E9E6E" class="ol"/>
      <path d="M-36,-128 L36,-128" stroke="#F2B632" stroke-width="5"/>
      <g id="sisHead">
        <circle cx="-62" cy="-214" r="20" fill="#2A1A10"/>
        <circle cx="62" cy="-214" r="20" fill="#2A1A10"/>
        <circle cx="-70" cy="-224" r="5" fill="#fff"/><circle cx="-58" cy="-230" r="5" fill="#fff"/><circle cx="-74" cy="-212" r="5" fill="#fff"/>
        <circle cx="70" cy="-224" r="5" fill="#fff"/><circle cx="58" cy="-230" r="5" fill="#fff"/><circle cx="74" cy="-212" r="5" fill="#fff"/>
        <circle cx="0" cy="-222" r="60" fill="#C98A5A" class="ol"/>
        <path d="M-60,-224 Q-62,-292 0,-290 Q62,-292 60,-224 Q48,-262 18,-262 Q0,-246 -18,-262 Q-48,-262 -60,-224 Z" fill="#2A1A10"/>
        <circle cx="0" cy="-246" r="4.5" fill="#D2342A"/>
        <ellipse cx="-21" cy="-218" rx="12" ry="14" fill="#fff" class="ol" stroke-width="3"/>
        <ellipse cx="21" cy="-218" rx="12" ry="14" fill="#fff" class="ol" stroke-width="3"/>

  <!-- the boy -->

    <g id="boyLegL"><rect x="-26" y="-74" width="23" height="68" rx="10" fill="#FFFFFF" class="ol"/><ellipse cx="-16" cy="-5" rx="16" ry="8" fill="#B87A4B" class="ol" stroke-width="3"/></g>
    <g id="boyLegR"><rect x="3" y="-74" width="23" height="68" rx="10" fill="#FFFFFF" class="ol"/><ellipse cx="16" cy="-5" rx="16" ry="8" fill="#B87A4B" class="ol" stroke-width="3"/></g>
    <g id="boyUpper">
      <g id="boyArmR"><rect x="38" y="-174" width="24" height="62" rx="11" fill="#F28C28" class="ol"/><circle cx="50" cy="-104" r="12" fill="#B87A4B" class="ol" stroke-width="3"/></g>
      <path d="M-48,-180 Q0,-190 48,-180 L60,-64 Q0,-54 -60,-64 Z" fill="#F28C28" class="ol"/>
      <path d="M-58,-78 Q0,-68 58,-78 L60,-64 Q0,-54 -60,-64 Z" fill="#F2B632"/>
      <path d="M0,-182 L0,-128" stroke="#C25E10" stroke-width="4"/>
      <circle cx="0" cy="-166" r="3.5" fill="#F2B632"/><circle cx="0" cy="-151" r="3.5" fill="#F2B632"/><circle cx="0" cy="-136" r="3.5" fill="#F2B632"/>
      <g id="boyArmL">
        <g id="sparkler" opacity="0">
          <line x1="-48" y1="-104" x2="-48" y2="-40" stroke="#8C8C8C" stroke-width="4" stroke-linecap="round"/>

        </g>
        <rect x="-62" y="-174" width="24" height="62" rx="11" fill="#F28C28" class="ol"/><circle cx="-50" cy="-104" r="12" fill="#B87A4B" class="ol" stroke-width="3"/>
      </g>
      <g id="boyHead">
        <circle cx="-70" cy="-246" r="14" fill="#B87A4B" class="ol" stroke-width="3"/>
        <circle cx="70" cy="-246" r="14" fill="#B87A4B" class="ol" stroke-width="3"/>
        <circle cx="0" cy="-250" r="72" fill="#B87A4B" class="ol"/>
        <g fill="#2A1A10">
          <circle cx="-58" cy="-292" r="28"/><circle cx="-28" cy="-316" r="30"/><circle cx="6" cy="-324" r="30"/>
          <circle cx="40" cy="-312" r="28"/><circle cx="64" cy="-286" r="24"/><circle cx="-72" cy="-266" r="17"/>
          <circle cx="74" cy="-262" r="15"/><circle cx="-30" cy="-292" r="18"/><circle cx="18" cy="-296" r="18"/>
        </g>
        <ellipse cx="-26" cy="-246" rx="14" ry="17" fill="#fff" class="ol" stroke-width="3"/>
        <ellipse cx="26" cy="-246" rx="14" ry="17" fill="#fff" class="ol" stroke-width="3"/>
        <g id="boyPupils"><circle cx="-26" cy="-244" r="8" fill="#2A1A10"/><circle cx="26" cy="-244" r="8" fill="#2A1A10"/><circle cx="-28" cy="-247" r="2.4" fill="#fff"/><circle cx="24" cy="-247" r="2.4" fill="#fff"/></g>
        <rect id="boyLidL" x="-42" y="-264" width="32" height="0" fill="#B87A4B"/>
        <rect id="boyLidR" x="10" y="-264" width="32" height="0" fill="#B87A4B"/>
        <path d="M-38,-272 Q-26,-279 -14,-273 M14,-273 Q26,-279 38,-272" fill="none" class="ol" stroke-width="4" id="boyBrows"/>

  <!-- question mark over the boy -->
  <text id="qmark" x="0" y="0" font-family="Baloo" font-weight="800" font-size="90" fill="#5B4636" opacity="0" text-anchor="middle">?</text>

  <g id="puff"></g>
  </g>

  <g id="diyas"></g>

  <g id="focus"></g>
  <g id="sfx"></g>
  </g>
  <g id="captions"></g>

  <!-- the wish -->
  <g id="endcard" opacity="0">
    <text id="wish" x="540" y="1500" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="148"
          fill="#E8731A" stroke="#7A2E0A" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Happy Diwali</text>

  <text id="sender" x="540" y="1600" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="56" fill="#6B3A1F" opacity="0"></text>
</svg>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eio = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const eout = p => 1 - Math.pow(1 - p, 3);
  const ein = p => p * p * p;
  const back = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  // keyframe track: [[t, v], ...], eased in-out between keys
  const track = (t, keys, ease = eio) => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return lerp(v0, v1, ease((t - t0) / (t1 - t0))); }
    }
    return keys[keys.length - 1][1];
  };
  const inRange = (t, a, b) => t >= a && t < b;
  const set = (el, k, v) => el.setAttribute(k, v);

  const G = 1150, CRX = 290, DURATION = 23, K = 1.25;
  const LY = G + (470 - G) / K; // launch apex in actor space = world y 470
  const world = (x, y) => [540 + (x - 540) * K, G + (y - G) * K];
  const params = new URLSearchParams(location.search);
  $('sender').textContent = params.get('name') || 'From our family to yours';

  // ---------- static decor ----------
  const toran = $('toran');
  for (let i = 0; i <= 26; i++) {
    const x = i * 1080 / 26, y = 110 + 70 * Math.sin(Math.PI * i / 26) - 22 * Math.sin(Math.PI * i / 13) ** 2;
    if (i % 3 === 1) mk('path', { d: `M${x},${y + 10} Q${x - 14},${y + 48} ${x},${y + 72} Q${x + 14},${y + 48} ${x},${y + 10} Z`, fill: '#5E9E3A', stroke: '#2F5A1C', 'stroke-width': 3 }, toran);
    mk('circle', { cx: x, cy: y, r: 20, fill: i % 2 ? '#F7B422' : '#F07F1A', stroke: '#9A4A0A', 'stroke-width': 3 }, toran);
    mk('circle', { cx: x - 5, cy: y - 5, r: 6, fill: '#FFE08A', opacity: 0.8 }, toran);
  }
  const rang = $('rangoli');
  const motif = (cx, cy, s) => {
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      mk('ellipse', { cx: cx + Math.cos(a) * 34 * s, cy: cy + Math.sin(a) * 34 * s, rx: 18 * s, ry: 9 * s, transform: `rotate(${a * 180 / Math.PI} ${cx + Math.cos(a) * 34 * s} ${cy + Math.sin(a) * 34 * s})`, fill: k % 2 ? '#E8558A' : '#F07F1A' }, rang);
      mk('circle', { cx: cx + Math.cos(a + Math.PI / 8) * 62 * s, cy: cy + Math.sin(a + Math.PI / 8) * 62 * s, r: 5 * s, fill: '#2E9E6E' }, rang);
    }
    mk('circle', { cx, cy, r: 14 * s, fill: '#F7B422' }, rang);
  };
  motif(110, 1800, 1); motif(970, 1800, 1); motif(60, 1680, 0.55); motif(1020, 1680, 0.55);

  // ---------- diyas ----------
  const DIYA_X = [130, 265, 400, 540, 680, 815, 950], DIYA_Y = 1262;
  const diyas = DIYA_X.map((x, i) => {
    const g = mk('g', { transform: `translate(${x},${DIYA_Y})` }, $('diyas'));
    const glow = mk('circle', { cx: 0, cy: -30, r: 90, fill: 'url(#glow)', opacity: 0 }, g);
    const flame = mk('g', { opacity: 0 }, g);
    const fo = mk('path', { d: 'M0,-58 Q-14,-30 0,-16 Q14,-30 0,-58 Z', fill: '#FF9A1F' }, flame);
    mk('path', { d: 'M0,-44 Q-7,-28 0,-19 Q7,-28 0,-44 Z', fill: '#FFF2A8' }, flame);
    mk('path', { d: 'M-46,-18 Q0,-12 46,-18 Q40,22 0,24 Q-40,22 -46,-18 Z', fill: 'url(#clay)', class: 'ol' }, g);
    for (let k = -2; k <= 2; k++) mk('circle', { cx: k * 15, cy: 2, r: 3.5, fill: '#F2B632' }, g);
    mk('ellipse', { cx: 0, cy: -18, rx: 46, ry: 7, fill: '#6B2E14', class: 'ol', 'stroke-width': 3 }, g);
    return { glow, flame, fo };
  });

  // ---------- particle pools ----------
  const sparkTip = $('sparkTip'), fuseSpark = $('fuseSpark'), sky = $('sky'), puff = $('puff'), petalsG = $('petals');
  const pool = (n, parent, tag, attrs) => Array.from({ length: n }, () => mk(tag, attrs, parent));
  const tipLines = pool(14, sparkTip, 'line', { stroke: '#FFD23F', 'stroke-width': 3, 'stroke-linecap': 'round' });
  const fuseLines = pool(12, fuseSpark, 'line', { stroke: '#FFC93C', 'stroke-width': 3, 'stroke-linecap': 'round' });
  const fuseCore = mk('circle', { r: 7, fill: '#FFF3B0' }, fuseSpark);
  const flash = mk('circle', { r: 0, fill: 'url(#flash)', opacity: 0 }, sky);
  const BURSTS = [
    { t: 16.5, x: 540, y: 470, n: 70, speed: [420, 640], cols: ['#FFD23F', '#FFB13B', '#FFF6C9', '#FF8A1F'] },
    { t: 16.85, x: 370, y: 560, n: 40, speed: [260, 420], cols: ['#FF5C8A', '#FFD23F', '#7FE07A'] },
    { t: 17.15, x: 720, y: 540, n: 40, speed: [260, 420], cols: ['#7FD1FF', '#FFD23F', '#FF8A1F'] },
  ];
  BURSTS.forEach(b => { b.lines = pool(b.n, sky, 'line', { 'stroke-width': 5, 'stroke-linecap': 'round' }); });
  const trail = pool(10, sky, 'circle', { fill: '#CFC6B8' });
  const puffs = pool(7, puff, 'circle', { fill: '#BDB5A8', stroke: '#8E8577', 'stroke-width': 3 });
  const PETALS = 44;
  const petals = Array.from({ length: PETALS }, (_, i) => mk('ellipse', { rx: 11, ry: 6, fill: i % 3 === 0 ? '#F7B422' : (i % 3 === 1 ? '#F07F1A' : '#FFD23F'), stroke: '#9A4A0A', 'stroke-width': 1.5 }, petalsG));
  const stars = Array.from({ length: 6 }, (_, i) => mk('path', { d: 'M0,-18 L5,-5 L18,0 L5,5 L0,18 L-5,5 L-18,0 L-5,-5 Z', fill: '#F7B422' }, $('wishStars')));
  const STAR_POS = [[110, 1440], [970, 1440], [70, 1530], [1010, 1530], [200, 1370], [880, 1370]];

  const fuse = $('fuse'), FUSE_LEN = fuse.getTotalLength();

  // ---------- mouths ----------
  const MOUTH = {
    smile: ['M{-16},{0} Q0,{14} {16},{0}', 'none'],
    grin:  ['M{-20},{-2} Q0,{22} {20},{-2} Z', '#7A2A1A'],
    O:     ['M{-8},{4} a8,10 0 1,0 16,0 a8,10 0 1,0 -16,0', '#7A2A1A'],
    o:     ['M{-5},{4} a5,6 0 1,0 10,0 a5,6 0 1,0 -10,0', '#7A2A1A'],
    flat:  ['M{-10},{4} L{10},{4}', 'none'],

  const mouth = (el, kind, cy, s = 1) => {

  function boyMouthFor(t) {
    if (t < 2.25) return 'grin';

  function sisMouthFor(t) {

  // ---------- frame ----------
  function drawBase(t) {
    // ===== boy =====
    const bx = track(t, [[0, 420], [3.0, 420], [4.4, 650]]);

    let armL = track(t, [[0, 40], [0.8, 62], [1.1, 62], [1.45, 12], [1.7, 12], [2.15, 86], [2.5, 86], [2.85, 25], [3.0, 10], [4.4, 10], [4.9, 20], [10.4, 20], [11.2, 4]]);
    let armR = track(t, [[0, 55], [0.8, 70], [1.1, 70], [1.45, -8], [4.4, -8], [4.9, -20], [10.4, -20], [11.2, -4]]);
    let legL = 0, legR = 0, bob = 0, headTilt = track(t, [[10.6, 0], [11.4, 8], [16.4, 8], [16.8, 0]]);
    if (inRange(t, 3.0, 4.4)) { const ph = Math.sin((t - 3.0) * Math.PI * 2 * 3.2); legL = ph * 34; legR = -ph * 34; armL = -ph * 40; armR = -ph * 40; bob = Math.abs(ph) * 14; lean = -0; }
    if (t >= 0.15 && t < 1.45) { const c = crouch / 24; legL = 14 * c; legR = -14 * c; }
    if (t >= 4.3 && t < 16.9) { const c = crouch / 26; legL = 18 * c; legR = -18 * c; }
    let jump = 0;
    if (t >= 16.95) {
      const p = t - 16.95, env = t < 20.2 ? 1 : Math.max(0, 1 - (t - 20.2) / 0.8) * 0.5 + 0.15;
      jump = Math.abs(Math.sin(p * Math.PI * 2.4)) * 70 * env;
      armL = 150 + Math.sin(p * 14) * 18; armR = -150 - Math.sin(p * 14 + 1) * 18;
      legL = jump > 10 ? -10 : 0; legR = jump > 10 ? 10 : 0;
    }
    set($('boy'), 'transform', `translate(${bx},${G - jump}) rotate(${lean})`);
    set($('boyUpper'), 'transform', `translate(0,${crouch + bob * 0.3})`);
    set($('boyLegL'), 'transform', `rotate(${legL} -14 -72)`);
    set($('boyLegR'), 'transform', `rotate(${legR} 14 -72)`);
    set($('boyArmL'), 'transform', `rotate(${armL} -50 -168)`);
    set($('boyArmR'), 'transform', `rotate(${armR} 50 -168)`);
    set($('boyHead'), 'transform', `rotate(${headTilt} 0 -180)`);
    let bpx = -6, bpy = 0;
    if (t >= 16.45 && t < 17.0) { bpx = 0; bpy = -7; }
    if (t >= 17.0) { bpx = 0; bpy = -3; }
    if (t >= 12.0 && t < 15.2) { bpx = -7; bpy = 4; }
    set($('boyPupils'), 'transform', `translate(${bpx},${bpy})`);
    const blid = (t >= 11.2 && t < 16.4 ? 8 : 0) + (blink(t, 0.3) * 30);
    set($('boyLidL'), 'height', Math.min(34, blid)); set($('boyLidR'), 'height', Math.min(34, blid));
    mouth($('boyMouth'), boyMouthFor(t), -212);
    set($('boyBrows'), 'transform', `translate(0,${t >= 2.25 && t < 4.6 ? -6 : (t >= 11 && t < 16.4 ? 3 : 0)})`);

    // sparkler in the boy's left hand, 1.2s - 3.0s

    set($('sparkler'), 'opacity', sparkOn ? 1 : 0);
    tipLines.forEach((l, i) => {

      const k = Math.floor(t * 30) * 31 + i;
      const a = rnd(k) * Math.PI * 2, r1 = 4, r2 = 10 + rnd(k + 7) * 26;
      set(l, 'x1', Math.cos(a) * r1); set(l, 'y1', Math.sin(a) * r1);

    // ===== little sister =====
    const sx = 770;
    const sLean = track(t, [[8.6, 0], [9.6, -7], [10.15, -7], [10.6, 0]]);
    const sCrouch = track(t, [[2.4, 0], [2.9, 12], [10.6, 12], [11.3, 6], [16.5, 6], [16.9, 0]]);
    let sArmL = track(t, [[0, 6], [2.35, 6], [2.8, 158], [10.7, 158], [11.3, 8]]);
    let sArmR = track(t, [[0, -6], [2.35, -6], [2.8, -158], [10.7, -158], [11.3, -8]]);
    let sJump = 0, sTilt = track(t, [[10.6, 0], [11.4, -8], [16.4, -8], [16.8, 0]]);
    if (t >= 17.05) {
      const p = t - 17.05, env = t < 20.2 ? 1 : Math.max(0, 1 - (t - 20.2) / 0.8) * 0.5 + 0.15;

    set($('sisArmR'), 'transform', `rotate(${sArmR} 40 -160)`);

    let spx = -5, spy = 0;

    const scared = t >= 2.6 && t < 8.6 ? 9 : 0;

    set($('sisLidL'), 'height', Math.min(30, slid)); set($('sisLidR'), 'height', Math.min(30, slid));
    mouth($('sisMouth'), sisMouthFor(t), -188, 0.85);

    // ===== puppy =====
    let px = track(t, [[0, 880], [2.4, 880], [3.4, 845], [9.2, 845], [9.55, 812], [10.2, 812], [10.6, 845], [12.0, 845], [13.8, 520], [15.15, 520], [15.65, 640]]);
    let py = 0, pFlip = 1, pHead = 0, pTail = Math.sin(t * 13) * 16, legPh = 0;

    if (inRange(t, 15.15, 15.65)) { const p = seg(t, 15.15, 15.65); py = Math.sin(p * Math.PI) * 80; pHead = -10; pTail = 35; }
    if (t >= 17.0) {
      const p = t - 17.0, env = t < 20.2 ? 1 : 0.35;

      pFlip = Math.cos(p * Math.PI * 2 * 0.9) || 0.01;

    set($('puppy'), 'transform', `translate(${px},${G - py}) scale(${pFlip},1)`);

    set($('pupLegF'), 'transform', `rotate(${legPh} -30 -40)`);

    set($('pupEar'), 'transform', `rotate(${Math.sin(t * 9) * 4 + (inRange(t, 15.15, 15.65) ? -25 : 0)} -34 -140)`);

    let cx = track(t, [[0, 352], [0.8, CRX]]), cy = track(t, [[0, G - 64], [0.8, G]]);
    let tip = track(t, [[10.4, 0], [10.82, 94], [10.95, 84], [11.08, 90], [15.3, 90], [15.62, 0]], p => p);

    set($('crackerBody'), 'transform', `rotate(${tip} 35 0)`);

    fuseLines.forEach((l, i) => {
      if (!fuseLit) { set(l, 'opacity', 0); return; }

      const a = -Math.PI / 2 + (rnd(k) - 0.5) * Math.PI * 1.6, r2 = 8 + rnd(k + 1) * 24;
      set(l, 'x1', 0); set(l, 'y1', 0); set(l, 'x2', Math.cos(a) * r2); set(l, 'y2', Math.sin(a) * r2);

    });

    // smoke trail

      const e = ein(seg(t0, 15.8, 16.5)) * 0.75 + seg(t0, 15.8, 16.5) * 0.25;
      const [wx, wy] = world(lerp(CRX, 540, e), lerp(G, LY, e)); set(c, 'cx', wx + (rnd(i) - 0.5) * 20); set(c, 'cy', wy + age * 30);

      b.lines.forEach((l, i) => {
        const age = t - b.t, life = 1.6 + rnd(bi * 100 + i) * 0.9;

      [mkSfx('SSSSS...', 50, '#FFE9A0'), 190, 860, -6, 5.4, 8.6, -4],
      [mkSfx('pfft.', 74, '#ECE7DE', '#8E8577'), 235, 870, -6, 10.22, 11.3, -12],
      [mkSfx('WAH-WAH...', 84, '#A9BEDF', '#4A5D7A'), 770, 610, 7, 11.05, 12.95, 22],
      [mkSfx('SNIFF SNIFF', 46, '#F1D3A6', '#A86B3C'), 400, 930, -10, 13.9, 15.0, -6],
      [mkSfx('?!', 100, '#FFD23F'), 470, 880, 12, 15.05, 15.75, 0],
      [mkSfx('FWOOOSH!', 92, '#FF8A1F'), 175, 720, -72, 15.78, 16.6, 0],
      [mkSfx('KA-BOOM!', 150, '#FFD23F', '#D2342A', [300, 200, 13]), 540, 460, -6, 16.5, 18.1, 0],
      [mkSfx('YAAAY!', 96, '#FF5C8A', '#8A1F45'), 820, 690, 8, 17.4, 19.9, -8],
    ];

    // --- narration captions (screen space) ---
    const capG = $('captions');
    const mkCap = txt => {
      const g = mk('g', { opacity: 0 }, capG);
      const r = mk('rect', { x: 0, y: -46, height: 92, fill: '#FFE45C', stroke: '#111', 'stroke-width': 6 }, g);
      const tx = mk('text', { x: 28, y: 4, 'font-family': 'Bangers', 'font-size': 58, fill: '#111', 'dominant-baseline': 'middle', 'letter-spacing': 2 }, g); tx.textContent = txt;
      return { g, r, tx };
    };
    const CAPS = [[mkCap('DIWALI NIGHT...'), 0.2, 3.0], [mkCap('WAIT FOR IT...'), 8.65, 10.15], [mkCap('...OR NOT.'), 11.4, 13.1]];

    // --- panel border ---
    const panel = $('panel');
    mk('rect', { x: -40, y: -40, width: 1160, height: 2000, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 124 }, panel);
    mk('rect', { x: 22, y: 22, width: 1036, height: 1876, fill: 'none', stroke: '#111', 'stroke-width': 12, rx: 6 }, panel);

    // --- comic end card ---
    const wish = $('wish');
    Object.entries({ 'font-family': 'Bangers', 'font-weight': 400, 'font-size': 150, fill: '#FFD23F', stroke: '#111', 'stroke-width': 12, 'letter-spacing': 6 }).forEach(([k, v]) => wish.setAttribute(k, v));
    wish.textContent = 'HAPPY DIWALI!';
    const ws = wish.cloneNode(true); ws.removeAttribute('id');
    Object.entries({ fill: '#D2342A', stroke: '#D2342A', x: 552, y: 1512 }).forEach(([k, v]) => ws.setAttribute(k, v));
    const wb = mkSfx('', 10, '#000', '#000', [420, 300, 16]); // starburst only
    $('endcard').insertBefore(wb, wish); wb.setAttribute('opacity', 1); wb.setAttribute('transform', 'translate(540,1462) scale(0.9,0.46)');
    $('endcard').insertBefore(ws, wish);
    const sender = $('sender');
    Object.entries({ 'font-family': 'Bangers', 'font-weight': 400, 'font-size': 60, fill: '#111', 'letter-spacing': 2, y: 1752 }).forEach(([k, v]) => sender.setAttribute(k, v));
    sender.textContent = sender.textContent.toUpperCase();
    const sbox = mk('rect', { y: 1702, height: 96, fill: '#FFE45C', stroke: '#111', 'stroke-width': 6, opacity: 0 }, $('stage'));
    $('stage').insertBefore(sbox, sender);

    // --- camera: comic "panel" punch-ins ---
    const CAM = [ // t, scale, centre x, centre y
      [0, 1, 540, 960], [2.0, 1, 540, 960], [2.3, 1.5, 300, 990], [2.9, 1.5, 300, 990], [3.3, 1, 540, 960],
      [8.6, 1, 540, 960], [10.15, 1.12, 470, 1000], [10.22, 1.75, 250, 1040], [11.0, 1.75, 250, 1040],
      [11.3, 1.6, 760, 900], [12.9, 1.6, 760, 900], [13.4, 1, 540, 960],
      [15.0, 1, 540, 960], [15.2, 1.25, 430, 1020], [15.7, 1.25, 430, 1020], [16.2, 1, 540, 960]];
    const camAt = (t, idx) => track(t, CAM.map(k => [k[0], k[idx]]));

    drawComic = t => {
      // camera
      let s = camAt(t, 1), cxm = camAt(t, 2), cym = camAt(t, 3);
      if (t >= 10.15 && t < 10.22) { s = 1.75; cxm = 250; cym = 1040; } // hard snap
      let shx = 0, shy = 0;
      if (t >= 16.5 && t < 17.0) { const a = (1 - seg(t, 16.5, 17.0)) * 16; shx = (rnd(Math.floor(t * 15)) - 0.5) * a * 2; shy = (rnd(Math.floor(t * 15) + 5) - 0.5) * a * 2; }
      set($('cam'), 'transform', `translate(540,960) scale(${s}) translate(${-cxm + shx},${-cym + shy})`);

      // rays
      const rayShow = (g, a, b, x, y, spin) => { const o = seg(t, a, a + 0.12) * (1 - seg(t, b - 0.25, b)); set(g, 'opacity', o); set(g, 'transform', `translate(${x},${y}) rotate(${t * spin})`); };
      rayShow(rayIgnite, 2.22, 3.0, 185, 945, 20);
      rayShow(rayPfft, 10.22, 11.1, 227, 1000, 0);
      rayShow(rayBoom, 16.5, 18.6, 540, 470, 8);
      rayShow(rayJoy, 18.4, 23.5, 540, 470, 5);
      // focus lines
      const fo = (g, a, b, x, y) => { set(g, 'opacity', (t >= a && t < b) ? 1 : 0); set(g, 'transform', `translate(${x},${y}) rotate(${Math.floor(t * 15) % 2 * 1.5})`); };
      fo(focusA, 10.22, 10.9, 227, 1000);
      fo(focusB, 16.5, 17.05, 540, 470);
      // speed lines while the boy runs (3.0 - 4.4)
      const bxw = 540 + (track(t, [[0, 420], [3.0, 420], [4.4, 650]]) - 540) * 1.25;
      runLines.forEach((l, i) => {
        const on = t >= 3.0 && t < 4.5; set(l, 'opacity', on ? 0.9 : 0); if (!on) return;
        const y = 860 + i * 40 + (rnd(i + Math.floor(t * 15)) - 0.5) * 10, len = 90 + rnd(i * 3 + Math.floor(t * 15)) * 140;
        const x2 = bxw - 90 - rnd(i + 40) * 30;
        set(l, 'x1', x2 - len); set(l, 'x2', x2); set(l, 'y1', y); set(l, 'y2', y);
      });
      // speed lines under the launching cracker (15.8 - 16.5)
      const lp = seg(t, 15.8, 16.5), le = ein(lp) * 0.75 + lp * 0.25;
      const lx = 540 + (lerp(CRX, 540, le) - 540) * 1.25, ly = G + (lerp(G, LY, le) - G) * 1.25;
      upLines.forEach((l, i) => {
        const on = t >= 15.85 && t < 16.5; set(l, 'opacity', on ? 0.85 : 0); if (!on) return;
        const x = lx + (i - 3.5) * 22, y0 = ly + 90 + rnd(i + Math.floor(t * 15)) * 60;
        set(l, 'x1', x); set(l, 'x2', x); set(l, 'y1', y0); set(l, 'y2', y0 + 120 + rnd(i * 7) * 160);
      });
      // lettering
      SFX.forEach(([g, x, y, rot, a, b, drift]) => {
        if (t < a || t >= b) { set(g, 'opacity', 0); return; }
        const pop = back(seg(t, a, a + 0.2)), out = 1 - seg(t, b - 0.25, b);
        const wob = Math.sin(Math.floor(t * 15) * 1.7) * 2.5;
        set(g, 'opacity', out);
        set(g, 'transform', `translate(${x},${y + (t - a) * drift}) rotate(${rot + wob}) scale(${Math.max(0.01, pop)})`);
      });
      // captions
      CAPS.forEach(([c, a, b]) => {
        const o = seg(t, a, a + 0.15) * (1 - seg(t, b - 0.2, b));
        const w = c.tx.getComputedTextLength() + 56;
        set(c.r, 'width', w); set(c.g, 'opacity', o);
        set(c.g, 'transform', `translate(60,300) rotate(-2)`);
      });
      // end card: starburst + sender box follow the existing fades
      set(ws, 'transform', wish.getAttribute('transform') || '');
      const sw = sender.getComputedTextLength() + 70;
      set(sbox, 'x', 540 - sw / 2); set(sbox, 'width', sw); set(sbox, 'opacity', sender.getAttribute('opacity'));
      set(sbox, 'transform', sender.getAttribute('transform') || '');
    };
  }

  function setTime(t) {
    const tq = COMIC ? Math.floor(t * 15 + 1e-6) / 15 : t; // comic mode animates "on twos"
    drawBase(tq);
    drawComic(tq);
  }

  window.DURATION = DURATION;
  window.setTime = setTime;
  setTime(0);
  if (!params.has('render')) {
    const start = performance.now();
    const loop = () => { setTime(((performance.now() - start) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
